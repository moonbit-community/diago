name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          moon version --all
          moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Type check
        run: moon check --target all --deny-warn

      - name: Run tests
        run: moon test --target all

      - name: Build native
        run: moon build cmd/diago --target native --release

      - name: Build WASM
        run: moon build cmd/wasm --target wasm --release

      - name: Smoke test WASM
        run: node scripts/wasm_smoke.mjs _build/wasm/release/build/cmd/wasm/wasm.wasm
